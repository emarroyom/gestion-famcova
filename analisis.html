<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Analisis FAMCOVA">
<title>Analisis FAMCOVA</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="shortcut icon" href="icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F2F2F7;color:#1C1C1E;min-height:100vh}
.header{background:#1F3864;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:10}
.header h1{color:#fff;font-size:17px;font-weight:600;text-align:center}
.header p{color:rgba(255,255,255,0.7);font-size:12px;text-align:center;margin-top:2px}
.header-actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.btn-back{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit}
.content{padding:16px;padding-bottom:max(60px,env(safe-area-inset-bottom))}
.section-title{font-size:12px;font-weight:600;color:#6D6D72;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;padding-left:4px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;color:#1F3864;margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:12px;padding:14px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:#1F3864;line-height:1}
.stat-label{font-size:11px;color:#6D6D72;margin-top:4px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtro-btn{padding:5px 12px;font-size:12px;border:0.5px solid #C7C7CC;border-radius:20px;background:#fff;color:#6D6D72;cursor:pointer;white-space:nowrap;font-family:inherit}
.filtro-btn.on{background:#1F3864;color:#fff;border-color:#1F3864}
.loading{text-align:center;padding:40px;color:#6D6D72;font-size:14px}
/* BARRAS */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:11px;color:#6D6D72;min-width:36px;text-align:right;flex-shrink:0}
.bar-label-left{font-size:11px;color:#1C1C1E;flex:0 0 80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:#F2F2F7;border-radius:4px;height:20px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.bar-val{font-size:10px;font-weight:700;color:#fff}
/* DONA */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-svg{flex-shrink:0}
.donut-legend{flex:1}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-label{font-size:12px;color:#1C1C1E;flex:1}
.legend-val{font-size:12px;font-weight:600;color:#1C1C1E}
/* TENDENCIA */
.trend-wrap{overflow-x:auto;padding-bottom:4px}
.trend-inner{min-width:320px}
/* TABS */
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:12px;gap:4px}
.tab{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;color:#6D6D72;background:transparent}
.tab.on{background:#1F3864;color:#fff;font-weight:600}
</style>
</head>
<body>

<div class="header">
  <div class="header-actions">
    <button class="btn-back" onclick="window.location.href='index.html'">Inicio</button>
    <span style="color:#fff;font-size:13px;font-weight:500">Dashboard</span>
    <button class="btn-back" id="btn-refresh" onclick="cargarYRenderizar()">Actualizar</button>
  </div>
  <h1 style="margin-top:6px">Analisis FAMCOVA</h1>
  <p>Zona 1-4 Region Central</p>
</div>

<div class="content" id="main-content">
  <div class="loading">Cargando datos...</div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxvNQyTXX2stItDJRFuNZYrTD8vJy7XjR9860hB5ZkuxrFav7JUpxzoYU4Ay5PUsBG7Yw/exec';
let adsData=[],proyData=[];
let anioFiltro='Todos';
const A={fecha:0,sol:1,solic:2,ruta:3,sec:4,est:5,aplica:6,rec:7,monto:8,evid:9,fcierre:10,obs:11,estado:12,prior:13};
const P={zona:0,ruta:1,sec:2,est:3,gestion:4,desc:5,prior:6,costo:7,fprop:8,fdef:9,solicitud:10,estado:11,contrato:12,obs:13};

const COLORES=['#1F3864','#1D9E75','#BA7517','#D85A30','#534AB7','#185FA5','#8B1A1A','#1A5C2E'];
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    window[cb]=data=>{res(data);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);};
    s.src=url+'&callback='+cb;
    s.onerror=()=>{delete window[cb];rej(new Error('error'));};
    document.head.appendChild(s);
    setTimeout(()=>{delete window[cb];rej(new Error('timeout'));},15000);
  });
}

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}

function getAnio(fecha){
  const s=String(fecha||'');
  if(s.includes('T'))return s.split('T')[0].split('-')[0];
  if(s.includes('-'))return s.split('-')[0];
  return null;
}
function getMes(fecha){
  const s=String(fecha||'');
  if(s.includes('T'))return s.split('T')[0].split('-')[1];
  if(s.includes('-'))return s.split('-')[1];
  return null;
}

async function cargarYRenderizar(){
  document.getElementById('btn-refresh').textContent='...';
  document.getElementById('main-content').innerHTML='<div class="loading">Cargando datos...</div>';
  try{
    const [j1,j2]=await Promise.all([
      jsonp(SCRIPT_URL+'?sheet=ADS&t='+Date.now()),
      jsonp(SCRIPT_URL+'?sheet=PROYECTOS&t='+Date.now())
    ]);
    adsData=(j1.data||[]).slice(1).filter(r=>r[0]||r[1]||r[2]);
    proyData=(j2.data||[]).slice(1).filter(r=>r[0]||r[P.desc]||r[P.gestion]);
    renderDashboard();
  }catch(e){
    document.getElementById('main-content').innerHTML='<div class="loading">Error de conexion. Toca Actualizar para reintentar.</div>';
  }
  document.getElementById('btn-refresh').textContent='Actualizar';
}

function getAniosFiltro(){
  const anios=[...new Set(adsData.map(r=>getAnio(r[A.fecha])).filter(a=>a&&a.length===4))].sort((a,b)=>b-a);
  return anios;
}

function getAdsFiltradas(){
  if(anioFiltro==='Todos')return adsData;
  return adsData.filter(r=>getAnio(r[A.fecha])===anioFiltro);
}

function renderDashboard(){
  const ads=getAdsFiltradas();
  const anios=getAniosFiltro();

  // Stats globales siempre con todos los datos
  const total=adsData.length;
  const atendidas=adsData.filter(r=>r[A.estado]==='Atendido').length;
  const pendientes=adsData.filter(r=>r[A.estado]==='Pendiente').length;
  const ejecucion=adsData.filter(r=>norm(r[A.estado]).includes('ejecuc')).length;
  const totalProy=proyData.length;
  const proyEjec=proyData.filter(r=>norm(r[P.estado]).includes('ejecuc')).length;

  const filtrosBtns=anios.map(a=>
    '<button class="filtro-btn'+(anioFiltro===a?' on':'')+'" onclick="setAnio(\''+a+'\')">'+a+'</button>'
  ).join('');

  document.getElementById('main-content').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">ADS historicas</div></div>
      <div class="stat-card"><div class="stat-num">${atendidas}</div><div class="stat-label">Atendidas</div></div>
      <div class="stat-card"><div class="stat-num">${pendientes}</div><div class="stat-label">Pendientes</div></div>
      <div class="stat-card"><div class="stat-num">${totalProy}</div><div class="stat-label">Proyectos</div></div>
    </div>

    <div class="tabs">
      <button class="tab on" id="tab-ads" onclick="switchTab('ads')">ADS</button>
      <button class="tab" id="tab-proy" onclick="switchTab('proy')">Proyectos</button>
    </div>

    <div id="panel-ads">
      <div class="section-title">Filtrar por ano</div>
      <div class="filtros">
        <button class="filtro-btn${anioFiltro==='Todos'?' on':''}" onclick="setAnio('Todos')">Todos</button>
        ${filtrosBtns}
      </div>
      <div id="charts-ads"></div>
    </div>

    <div id="panel-proy" style="display:none">
      <div id="charts-proy"></div>
    </div>
  `;

  renderChartsADS(ads);
  renderChartsProy();
}

function switchTab(tab){
  document.getElementById('tab-ads').classList.toggle('on',tab==='ads');
  document.getElementById('tab-proy').classList.toggle('on',tab==='proy');
  document.getElementById('panel-ads').style.display=tab==='ads'?'block':'none';
  document.getElementById('panel-proy').style.display=tab==='proy'?'block':'none';
}

function setAnio(a){
  anioFiltro=a;
  renderDashboard();
}

function renderChartsADS(ads){
  const container=document.getElementById('charts-ads');

  // 1. Por estado
  const estados={'Atendido':0,'Pendiente':0,'En ejecucion':0,'Programar':0};
  ads.forEach(r=>{const e=String(r[A.estado]||'Pendiente');if(estados[e]!==undefined)estados[e]++;else estados['Pendiente']++;});
  const estadoColors={'Atendido':'#1A5C2E','Pendiente':'#BA7517','En ejecucion':'#185FA5','Programar':'#D85A30'};

  // 2. Por mes (solo si hay filtro de año)
  let tendenciaHTML='';
  if(anioFiltro!=='Todos'){
    const porMes=Array(12).fill(0);
    const atendMes=Array(12).fill(0);
    ads.forEach(r=>{
      const m=parseInt(getMes(r[A.fecha]))-1;
      if(m>=0&&m<12){porMes[m]++;if(r[A.estado]==='Atendido')atendMes[m]++;}
    });
    const maxM=Math.max(...porMes,1);
    tendenciaHTML=`<div class="card">
      <div class="card-title">ADS por mes - ${anioFiltro}</div>
      <div class="trend-wrap"><div class="trend-inner">
        <svg width="${Math.max(320,12*52)}" height="120" viewBox="0 0 ${Math.max(320,12*52)} 120">
          ${porMes.map((v,i)=>{
            const x=i*52+10;const h=v>0?Math.max(4,Math.round(v/maxM*80)):0;const y=90-h;
            const ha=atendMes[i]>0?Math.max(2,Math.round(atendMes[i]/maxM*80)):0;const ya=90-ha;
            return`<rect x="${x}" y="${y}" width="20" height="${h}" fill="#1F3864" rx="3"/>
              <rect x="${x+22}" y="${ya}" width="18" height="${ha}" fill="#1A5C2E" rx="3"/>
              <text x="${x+10}" y="106" text-anchor="middle" font-size="9" fill="#6D6D72">${MESES[i]}</text>
              ${v>0?`<text x="${x+10}" y="${y-3}" text-anchor="middle" font-size="9" fill="#1F3864">${v}</text>`:''}`;
          }).join('')}
        </svg>
      </div></div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;background:#1F3864;border-radius:2px"></div><span style="font-size:11px;color:#6D6D72">Ingresadas</span></div>
        <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;background:#1A5C2E;border-radius:2px"></div><span style="font-size:11px;color:#6D6D72">Atendidas</span></div>
      </div>
    </div>`;
  }else{
    // tendencia anual
    const anios=[...new Set(ads.map(r=>getAnio(r[A.fecha])).filter(a=>a&&a.length===4))].sort();
    const porAnio={};const atendAnio={};
    anios.forEach(a=>{porAnio[a]=0;atendAnio[a]=0;});
    ads.forEach(r=>{const a=getAnio(r[A.fecha]);if(porAnio[a]!==undefined){porAnio[a]++;if(r[A.estado]==='Atendido')atendAnio[a]++;}});
    const maxA=Math.max(...anios.map(a=>porAnio[a]),1);
    const w=Math.max(320,anios.length*70);
    tendenciaHTML=`<div class="card">
      <div class="card-title">ADS por ano</div>
      <div class="trend-wrap"><div class="trend-inner">
        <svg width="${w}" height="130" viewBox="0 0 ${w} 130">
          ${anios.map((a,i)=>{
            const x=i*70+10;const h=Math.max(4,Math.round(porAnio[a]/maxA*90));const y=100-h;
            const ha=atendAnio[a]>0?Math.max(2,Math.round(atendAnio[a]/maxA*90)):0;const ya=100-ha;
            return`<rect x="${x}" y="${y}" width="26" height="${h}" fill="#1F3864" rx="3"/>
              <rect x="${x+28}" y="${ya}" width="24" height="${ha}" fill="#1A5C2E" rx="3"/>
              <text x="${x+13}" y="116" text-anchor="middle" font-size="9" fill="#6D6D72">${a}</text>
              <text x="${x+13}" y="${y-3}" text-anchor="middle" font-size="9" fill="#1F3864">${porAnio[a]}</text>`;
          }).join('')}
        </svg>
      </div></div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;background:#1F3864;border-radius:2px"></div><span style="font-size:11px;color:#6D6D72">Ingresadas</span></div>
        <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;background:#1A5C2E;border-radius:2px"></div><span style="font-size:11px;color:#6D6D72">Atendidas</span></div>
      </div>
    </div>`;
  }

  // 3. Por estado dona
  const totalAds=ads.length||1;
  const estadoEntries=Object.entries(estados).filter(([,v])=>v>0);
  let offset=0;const r=40;const circ=2*Math.PI*r;
  const segments=estadoEntries.map(([e,v],i)=>{
    const pct=v/totalAds;const dash=pct*circ;const gap=circ-dash;
    const seg=`<circle cx="55" cy="55" r="${r}" fill="none" stroke="${estadoColors[e]||COLORES[i]}" stroke-width="18" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 55 55)"/>`;
    offset+=dash;return seg;
  }).join('');

  const legendItems=estadoEntries.map(([e,v],i)=>
    `<div class="legend-item"><div class="legend-dot" style="background:${estadoColors[e]||COLORES[i]}"></div><span class="legend-label">${e}</span><span class="legend-val">${v}</span></div>`
  ).join('');

  // 4. Top rutas
  const rutaCount={};
  ads.forEach(r=>{const ru=String(r[A.ruta]||'Sin ruta').trim();rutaCount[ru]=(rutaCount[ru]||0)+1;});
  const topRutas=Object.entries(rutaCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxRuta=topRutas[0]?topRutas[0][1]:1;
  const rutaBars=topRutas.map(([ru,v],i)=>
    `<div class="bar-row">
      <div class="bar-label-left">Ruta ${ru}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxRuta*100)}%;background:${COLORES[i%COLORES.length]}"><span class="bar-val">${v}</span></div></div>
    </div>`
  ).join('');

  // 5. Top solicitantes
  const solCount={};
  ads.forEach(r=>{const s=String(r[A.sol]||'Sin nombre').trim();solCount[s]=(solCount[s]||0)+1;});
  const topSol=Object.entries(solCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxSol=topSol[0]?topSol[0][1]:1;
  const solBars=topSol.map(([s,v],i)=>
    `<div class="bar-row">
      <div class="bar-label-left">${s}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxSol*100)}%;background:${COLORES[i%COLORES.length]}"><span class="bar-val">${v}</span></div></div>
    </div>`
  ).join('');

  container.innerHTML=`
    ${tendenciaHTML}
    <div class="card">
      <div class="card-title">Distribucion por estado</div>
      <div class="donut-wrap">
        <svg class="donut-svg" width="110" height="110" viewBox="0 0 110 110">${segments}<text x="55" y="59" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">${ads.length}</text><text x="55" y="70" text-anchor="middle" font-size="9" fill="#6D6D72">ADS</text></svg>
        <div class="donut-legend">${legendItems}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Top rutas con mas solicitudes</div>
      ${rutaBars||'<div style="color:#6D6D72;font-size:13px">Sin datos</div>'}
    </div>
    <div class="card">
      <div class="card-title">Top solicitantes</div>
      ${solBars||'<div style="color:#6D6D72;font-size:13px">Sin datos</div>'}
    </div>
  `;
}

function renderChartsProy(){
  const container=document.getElementById('charts-proy');
  const total=proyData.length||1;

  // Por estado dona
  const estadosProy={'Pendiente':0,'Ejecucion':0,'Atendido':0};
  proyData.forEach(r=>{
    const e=String(r[P.estado]||'Pendiente');
    if(norm(e).includes('ejecuc'))estadosProy['Ejecucion']++;
    else if(e==='Atendido')estadosProy['Atendido']++;
    else estadosProy['Pendiente']++;
  });
  const estadoColorsProy={'Atendido':'#1A5C2E','Pendiente':'#BA7517','Ejecucion':'#185FA5'};
  const estadoEntriesProy=Object.entries(estadosProy).filter(([,v])=>v>0);
  let offset2=0;const r2=40;const circ2=2*Math.PI*r2;
  const segs2=estadoEntriesProy.map(([e,v],i)=>{
    const pct=v/total;const dash=pct*circ2;const gap=circ2-dash;
    const seg=`<circle cx="55" cy="55" r="${r2}" fill="none" stroke="${estadoColorsProy[e]||COLORES[i]}" stroke-width="18" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset2}" transform="rotate(-90 55 55)"/>`;
    offset2+=dash;return seg;
  }).join('');
  const leg2=estadoEntriesProy.map(([e,v],i)=>
    `<div class="legend-item"><div class="legend-dot" style="background:${estadoColorsProy[e]||COLORES[i]}"></div><span class="legend-label">${e}</span><span class="legend-val">${v}</span></div>`
  ).join('');

  // Por tipo de gestion
  const gestionCount={};
  proyData.forEach(r=>{const g=String(r[P.gestion]||'Sin tipo').trim();gestionCount[g]=(gestionCount[g]||0)+1;});
  const topGestion=Object.entries(gestionCount).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const maxG=topGestion[0]?topGestion[0][1]:1;
  const gBars=topGestion.map(([g,v],i)=>
    `<div class="bar-row">
      <div class="bar-label-left">${g}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxG*100)}%;background:${COLORES[i%COLORES.length]}"><span class="bar-val">${v}</span></div></div>
    </div>`
  ).join('');

  // Por prioridad
  const priorCount={'Alta':0,'Media':0,'Baja':0};
  proyData.forEach(r=>{
    const p=String(r[P.prior]||'');
    if(p==='Alta'||p==='1')priorCount['Alta']++;
    else if(p==='Media'||p==='2')priorCount['Media']++;
    else if(p==='Baja'||p==='3')priorCount['Baja']++;
  });
  const priorColors={'Alta':'#FF3B30','Media':'#FF9500','Baja':'#34C759'};
  const maxPrior=Math.max(...Object.values(priorCount),1);
  const priorBars=Object.entries(priorCount).map(([p,v])=>
    `<div class="bar-row">
      <div class="bar-label-left">${p}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxPrior*100)}%;background:${priorColors[p]}"><span class="bar-val">${v}</span></div></div>
    </div>`
  ).join('');

  // Por ruta
  const rutaProy={};
  proyData.forEach(r=>{const ru=String(r[P.ruta]||'Sin ruta').trim();rutaProy[ru]=(rutaProy[ru]||0)+1;});
  const topRutaProy=Object.entries(rutaProy).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxRP=topRutaProy[0]?topRutaProy[0][1]:1;
  const rpBars=topRutaProy.map(([ru,v],i)=>
    `<div class="bar-row">
      <div class="bar-label-left">Ruta ${ru}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxRP*100)}%;background:${COLORES[i%COLORES.length]}"><span class="bar-val">${v}</span></div></div>
    </div>`
  ).join('');

  container.innerHTML=`
    <div class="card">
      <div class="card-title">Proyectos por estado</div>
      <div class="donut-wrap">
        <svg class="donut-svg" width="110" height="110" viewBox="0 0 110 110">${segs2}<text x="55" y="59" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">${proyData.length}</text><text x="55" y="70" text-anchor="middle" font-size="9" fill="#6D6D72">Proyectos</text></svg>
        <div class="donut-legend">${leg2}</div>
      </div>
    </div>
    <div class="card">
